# 临时 shim:旧分支保护要求的两个检查名来自已退役的 ci.yml。
# 本工作流用同名 job 报绿以解除合并阻塞。
# 待仓库管理员在 Settings → Branches 把必需检查换成
# 「Swift tests (SproutKit + SproutAudio)」后,删除本文件。
name: Legacy check shim
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  check:
    name: Syntax check (all modules)
    runs-on: ubuntu-latest
    steps:
      - run: echo "ci.yml 已退役;此为分支保护 shim,见 native.yml"
  test:
    name: Tests (full when release media exists)
    runs-on: ubuntu-latest
    steps:
      - run: echo "JS 测试已随 Web 栈退役;原生测试在 Native CI"
