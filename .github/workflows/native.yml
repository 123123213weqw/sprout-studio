name: Native CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: Swift tests (SproutKit + SproutAudio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      # 互维护防漂移:shared/*.json 与各栈消费点必须一致
      - run: node tools/sync-shared.mjs && git diff --exit-code
      # SproutKit/SproutAudio 均为纯 Swift(离线渲染器不含 Apple 专属 API),
      # Linux 直接跑全部对拍测试;采样渲染测试在无媒体目录时自动跳过
      - run: swift test --package-path native

  macos-app:
    name: macOS tests + App 打包
    runs-on: macos-latest
    # 托管 macOS runner 在当前账号可能长时间排队;失败不阻塞合并。
    # 本地等价:swift test --package-path native && ./tools/package-app.sh
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # macOS 直接用 runner 预装 Xcode 的 Swift(装独立工具链会与 SDK 版本不匹配)
      - run: swift test --package-path native
      - name: 打包 SproutPlayer.app 与 DMG
        run: ./tools/package-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SproutPlayer-app
          path: |
            *.app
            *.dmg
